services:
  - type: web
    name: income-predictor
    runtime: python
    plan: free
    # The model is trained during the build, so model.joblib never needs committing.
    buildCommand: "pip install -r requirements.txt && python train_model.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
